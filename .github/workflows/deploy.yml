# PRD R22: deploy appmarket.org. Manual only, started by the owner (required reviewers need a paid
# GitHub plan on private repos); each run uses its GitHub environment (staging, production), whose
# secrets hold the Cloudflare API token. Runbook: docs/deploy-runbook.md.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      MODE: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global cf@1.0.0-beta.10

      - name: Checks
        run: pnpm typecheck && pnpm test && pnpm check:secrets && pnpm check:ui

      - name: Preflight (environment config)
        id: preflight
        working-directory: apps/api
        run: echo "database_id=$(pnpm -s exec tsx scripts/preflight.ts "$MODE")" >> "$GITHUB_OUTPUT"

      - name: Apply D1 migrations
        working-directory: apps/api
        run: node scripts/migrate.mjs --remote "${{ steps.preflight.outputs.database_id }}"

      # Worker secrets come from this GitHub environment's secrets on every deploy (a new Worker
      # cannot be created without them). Unset ones get a placeholder so the deploy still works;
      # the feature behind them stays off until the real value is set. The file is deleted after.
      - name: Deploy API Worker
        working-directory: apps/api
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          DOWNLOAD_SIGNING_KEY: ${{ secrets.DOWNLOAD_SIGNING_KEY }}
          CF_OAUTH_CLIENT_ID: ${{ secrets.CF_OAUTH_CLIENT_ID }}
          CF_OAUTH_CLIENT_SECRET: ${{ secrets.CF_OAUTH_CLIENT_SECRET }}
          CF_TOKEN_ENCRYPTION_KEY: ${{ secrets.CF_TOKEN_ENCRYPTION_KEY }}
          TRANSCRIPT_KEY: ${{ secrets.TRANSCRIPT_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$file"' EXIT
          node scripts/secrets-file.mjs > "$file"
          chmod 600 "$file"
          cf deploy --mode "$MODE" --message "${{ github.sha }}" --secrets-file "$file"

      - name: Build and deploy web Worker
        working-directory: apps/web
        run: |
          pnpm exec ng build
          if [ "$MODE" = staging ]; then pnpm exec wrangler deploy --env staging; else pnpm exec wrangler deploy; fi

      # Retries for a minute: new DNS records and Worker versions take a few seconds to reach every
      # location, and the old web version may briefly call the new API.
      - name: Smoke test
        run: |
          origin=$([ "$MODE" = staging ] && echo https://staging.appmarket.org || echo https://appmarket.org)
          for i in $(seq 1 12); do
            if curl -fsS "$origin/api/health" && curl -fsS -o /dev/null "$origin/" && curl -fsS -o /dev/null "$origin/search"; then exit 0; fi
            sleep 5
          done
          exit 1
