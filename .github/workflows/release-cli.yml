name: Release CLI

# Publishes the `appmarket` npm package when a tag cli-v<version> is pushed. Uses npm trusted
# publishing (OIDC): no npm token is stored, and (once the repository is public) every release
# carries a provenance attestation linking it to this workflow run. One-time setup on npmjs.com: package `appmarket` → Settings →
# Trusted publisher → GitHub Actions, repository AppMarket-org/app, workflow release-cli.yml.

on:
  push:
    tags: ["cli-v*"]
  # Builds and smoke-tests the binaries only (no npm publish, no GitHub release).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1 or later.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the package version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          [ "$GITHUB_REF_NAME" = "cli-v$version" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          grep -q "VERSION = \"$version\"" packages/cli/src/config.ts || { echo "src/config.ts VERSION is not $version"; exit 1; }
      - run: pnpm --filter appmarket typecheck
      - run: pnpm --filter appmarket test
      # pnpm pack resolves workspace: versions in the manifest; npm publishes the tarball with provenance.
      - run: pnpm --filter appmarket exec pnpm pack --pack-destination "$RUNNER_TEMP"
      # npm accepts provenance only from public repositories; it is added once the repo is public.
      - run: npm install -g npm@latest && npm publish "$RUNNER_TEMP"/appmarket-*.tgz --access public ${{ github.event.repository.private == false && '--provenance' || '' }}

  # #126: standalone binaries for machines without Node (Bun --compile; the keychain module is embedded,
  # so each binary is built on its own platform). Not code-signed: each file has a SHA-256 checksum and
  # a GitHub build attestation (`gh attestation verify <file> --repo AppMarket-org/app`). No Windows
  # binary at launch (owner's decision, 2026-10-06); Windows uses npm.
  binaries:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: bun-darwin-arm64, name: appmarket-darwin-arm64 }
          - { os: macos-15-intel, target: bun-darwin-x64, name: appmarket-darwin-x64 }
          - { os: ubuntu-latest, target: bun-linux-x64, name: appmarket-linux-x64 }
          - { os: ubuntu-24.04-arm, target: bun-linux-arm64, name: appmarket-linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: packages/cli
        run: bun build src/index.ts --compile --minify --target=${{ matrix.target }} --outfile "$RUNNER_TEMP/${{ matrix.name }}"
      - name: Smoke test
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          [ "$("$RUNNER_TEMP/${{ matrix.name }}" --version)" = "$version" ]
          APPMARKET_HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/${{ matrix.name }}" --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}

  release:
    needs: [publish, binaries]
    if: startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true
      - name: Checksums
        working-directory: bin
        run: chmod +x appmarket-* && sha256sum appmarket-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: bin/appmarket-*
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/* --repo "$GITHUB_REPOSITORY" --title "appmarket CLI ${GITHUB_REF_NAME#cli-v}" --notes "Standalone binaries for machines without Node (npm: \`npm install -g appmarket\`). Not code-signed: check the file against SHA256SUMS, or run \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`. On macOS, clear the quarantine flag once: \`xattr -d com.apple.quarantine appmarket-darwin-*\`."
