name: CI

# Once per change: on the pull request (merges are squashes of exactly that change, and the Deploy
# workflow runs the checks again before deploying), in one job (GitHub bills each job by the
# rounded-up minute).
on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Credentials anywhere in the Git history (gitleaks CLI, MIT; its GitHub Action needs a paid
      # license for organizations).
      - run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
      # Every commit in the pull request is signed off (DCO, CONTRIBUTING.md).
      - run: node scripts/check-dco.mjs ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check:secrets
      - run: pnpm check:ui
