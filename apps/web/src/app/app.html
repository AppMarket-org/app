<mat-toolbar>
  <a class="brand" routerLink="/">appmarket.org</a>
  <span class="spacer"></span>
  <a mat-button routerLink="/search">Search</a>

  @if (auth.user(); as user) {
    <a mat-button routerLink="/dashboard">Dashboard</a>
    <button mat-icon-button type="button" [matMenuTriggerFor]="account" aria-label="Account menu">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #account="matMenu">
      <div class="account" mat-menu-item disabled>{{ user.name }}</div>
      <button mat-menu-item type="button" (click)="signOut()">Sign out</button>
    </mat-menu>
  } @else if (auth.user() === null) {
    <a mat-flat-button routerLink="/login">Sign in</a>
  }
</mat-toolbar>

<main>
  <router-outlet />
</main>

<footer>
  <a routerLink="/legal/terms">Terms</a>
  <a routerLink="/legal/privacy">Privacy</a>
  <a routerLink="/legal/content-policy">Content policy</a>
  <a routerLink="/legal/developer-agreement">Developer agreement</a>
</footer>
