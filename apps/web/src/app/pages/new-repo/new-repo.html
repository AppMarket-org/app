<h1>New repo</h1>
<p class="intro">A repo holds your app's code and starts private. Push your code, then submit a tagged version for review. Once an admin approves it, the repo is public on the marketplace with its own page, and anyone can deploy it.</p>

<mat-card appearance="outlined">
  @if (saving()) {
    <mat-progress-bar mode="indeterminate" aria-label="Creating your repo" />
  }
  <mat-card-content>
    <app-repo-form submitLabel="Create draft" [saving]="saving()" [errorMessage]="errorMessage()" [fieldErrors]="fieldErrors()" (saved)="create($event)" />
  </mat-card-content>
</mat-card>
