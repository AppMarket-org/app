<h1>New listing</h1>
<p class="intro">Your listing starts as a private draft with its own Git repository. Push your code, then submit a tagged version for review.</p>

<mat-card appearance="outlined">
  @if (saving()) {
    <mat-progress-bar mode="indeterminate" aria-label="Creating listing" />
  }
  <mat-card-content>
    <app-listing-form submitLabel="Create draft" [saving]="saving()" [errorMessage]="errorMessage()" [fieldErrors]="fieldErrors()" (saved)="create($event)" />
  </mat-card-content>
</mat-card>
