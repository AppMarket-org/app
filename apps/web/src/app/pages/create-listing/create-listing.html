<h1>Publish an app</h1>
<p class="intro">Your app starts as a private draft with its own Git repository for the code. Push your code, then submit a tagged version for review. Once an admin approves it, it gets a public page and anyone can deploy it.</p>

<mat-card appearance="outlined">
  @if (saving()) {
    <mat-progress-bar mode="indeterminate" aria-label="Creating your app" />
  }
  <mat-card-content>
    <app-listing-form submitLabel="Create draft" [saving]="saving()" [errorMessage]="errorMessage()" [fieldErrors]="fieldErrors()" (saved)="create($event)" />
  </mat-card-content>
</mat-card>
