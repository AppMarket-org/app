@if (page; as p) {
  <article>
    <mat-card appearance="outlined" class="draft" role="note">
      <mat-card-content>
        <mat-icon>gavel</mat-icon>
        <span>Draft, not yet in effect. Pending legal review; bracketed details are placeholders.</span>
      </mat-card-content>
    </mat-card>
    <app-markdown [source]="p.markdown" [shiftHeadings]="false" />
  </article>
} @else {
  <h1>Page not found</h1>
}
