@if (page(); as p) {
  <div class="legal-layout">
    <aside class="legal-nav">
      <p class="eyebrow">LEGAL &amp; TRUST</p>
      <nav aria-label="Legal documents">
        @for (item of navigation; track item.slug) {
          <a
            mat-button
            [routerLink]="['/legal', item.slug]"
            [class.selected]="item.slug === slug()"
            [attr.aria-current]="item.slug === slug() ? 'page' : null"
            >{{ item.label }}</a
          >
        }
      </nav>
      <p class="nav-note">How we work together, protect information, and publish responsibly.</p>
    </aside>
    <article class="legal-document" [attr.aria-label]="p.title">
      <p class="document-meta">Updated October 5, 2026</p>
      <app-markdown class="legal-copy" [source]="p.markdown" [shiftHeadings]="false" />
    </article>
  </div>
} @else {
  <app-not-found-view message="This legal document could not be found." returnUrl="/legal/terms" returnLabel="View Terms of Service" />
}
