<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ repo().name }}</mat-card-title>
    <mat-card-subtitle>{{ categoryName(repo().category) }} · by {{ repo().owner.name }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p>{{ repo().summary }}</p>
    <app-runtime-badge [runtime]="repo().runtime" />
  </mat-card-content>
  <mat-card-actions>
    <a mat-button [routerLink]="['/apps', repo().slug]" [attr.aria-label]="'View app: ' + repo().name">View app</a>
  </mat-card-actions>
</mat-card>
