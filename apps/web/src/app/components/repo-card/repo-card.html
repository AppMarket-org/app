<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ repo().name }}</mat-card-title>
    <app-avatar mat-card-avatar [name]="repo().owner.name" [src]="repo().owner.avatarUrl" [kind]="repo().owner.kind" [size]="2.5" [decorative]="true" />
    <mat-card-subtitle>{{ categoryName(repo().category) }} · by {{ repo().owner.name }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p>{{ repo().summary }}</p>
    <app-runtime-badge [runtime]="repo().runtime" />
  </mat-card-content>
  <mat-card-actions class="actions">
    <a mat-button [routerLink]="'/' + repo().fullName" [attr.aria-label]="'View app: ' + repo().name">View app</a>
    <span class="meta">
      <span class="price">{{ repo().priceCents > 0 ? '$' + (repo().priceCents / 100).toFixed(2) : 'Free' }}</span>
      @if (topLanguage(); as lang) {
        <span class="language"><span class="dot" [class.other]="!lang.color" [style.background-color]="lang.color" aria-hidden="true"></span>{{ lang.name }}</span>
      }
      <span class="cowbells" [attr.aria-label]="repo().cowbells + ' cowbells'"><mat-icon svgIcon="cowbell" aria-hidden="true" />{{ repo().cowbells }}</span>
    </span>
  </mat-card-actions>
</mat-card>
