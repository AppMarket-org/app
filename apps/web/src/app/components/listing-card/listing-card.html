<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ listing().name }}</mat-card-title>
    <mat-card-subtitle>{{ categoryName(listing().category) }} · by {{ listing().owner.name }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p>{{ listing().summary }}</p>
    <app-runtime-badge [runtime]="listing().runtime" />
  </mat-card-content>
  <mat-card-actions>
    <a mat-button [routerLink]="['/apps', listing().slug]" [attr.aria-label]="'View app: ' + listing().name">View app</a>
  </mat-card-actions>
</mat-card>
